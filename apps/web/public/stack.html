<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LaunchPad Stack</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#120504; overflow:hidden; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  canvas { display:block; width:min(100vw, calc(100vh * 7 / 12), 520px); aspect-ratio:7 / 12; background:#1a0705; cursor:pointer; outline:none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="LaunchPad Stack game. Press space or tap to drop the block onto the tower."></canvas>
<script>
(() => {
  "use strict";

  /* ---------- tuning ---------- */
  const W = 420, H = 720;            // logical canvas size
  const S = 100, R = 16;             // block side and corner fillet (plan units, same shape as the logo)
  const BH = 14;                     // slab thickness
  const U = 1.08;                    // plan units -> pixels
  const TOWER = 50;                  // blocks per tower
  const RANGE = 165;                 // how far the sliding block swings either side of the tower
  const SPEED0 = 560, SPEED_STEP = 7, SPEED_MAX = 1500; // plan units / s -> very fast
  const TOL0 = 15, TOL_MIN = 8, PERFECT = 3.5;           // forgiveness (plan units)
  const YELLOW = [252, 168, 23], RED = [230, 0, 4];      // brand secondary -> primary
  const BASE_Y = H * 0.60;
  const KEY = "launchpad-stack-best";
  const COS = 0.866, SIN = 0.5;

  /* ---------- canvas ---------- */
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
  }
  addEventListener("resize", fit); fit();

  const lerp = (a, b, t) => a + (b - a) * t;
  const rgb = (c, a = 1, k = 1) => `rgba(${(c[0] * k) | 0},${(c[1] * k) | 0},${(c[2] * k) | 0},${a})`;
  const mix = t => [lerp(YELLOW[0], RED[0], t), lerp(YELLOW[1], RED[1], t), lerp(YELLOW[2], RED[2], t)];
  const tcol = i => mix(Math.min(1, i / (TOWER - 1)));

  /* ---------- geometry ---------- */
  // rounded square outline in plan space, centred on the origin
  const OUT = (() => {
    const pts = [], h = S / 2, r = R, n = 8;
    for (const [cx, cy, a0] of [[-h + r, -h + r, 180], [h - r, -h + r, 270], [h - r, h - r, 0], [-h + r, h - r, 90]])
      for (let i = 0; i <= n; i++) { const a = (a0 + 90 * i / n) * Math.PI / 180; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    return pts;
  })();
  const HEX = Array.from({ length: 6 }, (_, i) => { const a = (30 + 60 * i) * Math.PI / 180; return [33 * Math.cos(a), 33 * Math.sin(a)]; });

  let camZ = 0, camShiftY = 0;
  function proj(x, y, z, camv = camZ, dy = 0) {
    return [W / 2 + (x - y) * COS * U, BASE_Y - (z - camv) * U + (x + y) * SIN * U + dy];
  }
  function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
  function hull(pts) {
    pts = pts.slice().sort((p, q) => p[0] - q[0] || p[1] - q[1]);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    lo.pop(); up.pop(); return lo.concat(up);
  }
  function path(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }

  /* ---------- state ---------- */
  let best = 0;
  try { best = parseInt(localStorage.getItem(KEY) || "0", 10) || 0; } catch {}
  let score = 0, streak = 0, towers = 0, turn = 0;
  let tower = 0;                       // blocks placed in the current tower (all stay perfectly square)
  let cur = null;                      // sliding block {axis,p,dir,speed}
  let pieces = [];                     // blocks that missed and fall away
  let retired = null;                  // finished tower dropping out of view
  let flash = null;                    // ring on a perfect drop
  let lock = 0, hint = 4, shake = 0;

  const tol = () => Math.max(TOL_MIN, TOL0 - tower * 0.2);
  const speedNow = () => Math.min(SPEED_MAX, SPEED0 + (score + towers * TOWER) * SPEED_STEP);
  function saveBest() { if (score > best) { best = score; try { localStorage.setItem(KEY, String(best)); } catch {} } }

  function spawn() {
    // even turns arrive from the left (along x), odd turns from the right (along y)
    cur = { axis: turn & 1, p: -RANGE, dir: 1, speed: speedNow() };
  }
  function newTower() { tower = 1; camZ = 0; spawn(); }

  /* ---------- actions ---------- */
  function drop() {
    if (lock > 0 || !cur) return;
    hint = 0;
    const z = tower * BH;
    const off = Math.abs(cur.p);
    if (off <= tol()) {                              // lands: snaps onto the stack, still a full square
      const perfect = off <= PERFECT;
      streak = perfect ? streak + 1 : 0;
      score += 1 + (perfect ? Math.min(streak, 5) : 0);
      if (perfect) flash = { z, t: 0 };
      tower++; saveBest();
      turn++;
      if (tower === TOWER) {                         // 50th block is the logo block: finish this tower
        retired = { camZ, fall: 0, vy: 0, count: TOWER };
        towers++; lock = 0.5; shake = 0.3; cur = null;
        setTimeout(newTower, 420);
        return;
      }
      spawn();
    } else {                                         // misses: falls away, try again
      const sgn = cur.dir;
      pieces.push({ x: cur.axis ? 0 : cur.p, y: cur.axis ? cur.p : 0, z, vz: 60, vx: cur.axis ? 0 : sgn * 200, vy: cur.axis ? sgn * 200 : 0, a: 1, i: tower });
      streak = 0; shake = 0.12; turn++; spawn();
    }
  }

  addEventListener("pointerdown", e => { e.preventDefault(); drop(); }, { passive: false });
  addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowDown") { e.preventDefault(); if (!e.repeat) drop(); }
  });

  /* ---------- update ---------- */
  function update(dt) {
    if (lock > 0) lock -= dt;
    if (hint > 0) hint -= dt;
    if (shake > 0) shake -= dt;
    if (cur) {
      cur.p += cur.dir * cur.speed * dt;
      if (cur.p > RANGE) { cur.p = RANGE; cur.dir = -1; }
      else if (cur.p < -RANGE) { cur.p = -RANGE; cur.dir = 1; }
    }
    // the perspective follows the active block up the tower
    const target = Math.max(0, (tower - 2.5) * BH);
    camZ += (target - camZ) * Math.min(1, dt * 9);
    for (const p of pieces) { p.vz -= 1900 * dt; p.z += p.vz * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a -= dt * 0.85; }
    pieces = pieces.filter(p => p.a > 0);
    if (retired) { retired.vy += 2600 * dt; retired.fall += retired.vy * dt; if (retired.fall > 1700) retired = null; }
    if (flash) { flash.t += dt * 3.4; if (flash.t >= 1) flash = null; }
  }

  /* ---------- drawing ---------- */
  function drawBlock(ox, oy, zb, color, hexTop, alpha, camv, dy) {
    const top = OUT.map(p => proj(ox + p[0], oy + p[1], zb + BH, camv, dy));
    const bot = OUT.map(p => proj(ox + p[0], oy + p[1], zb, camv, dy));
    const body = hull(top.concat(bot));
    const cx = W / 2 + (ox - oy) * COS * U;
    ctx.globalAlpha = alpha;
    ctx.lineJoin = "round"; ctx.lineWidth = 3; ctx.strokeStyle = "#000";
    // walls: lit left, shaded right
    path(body); ctx.fillStyle = rgb(color); ctx.fill();
    ctx.save(); path(body); ctx.clip(); ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(cx, 0, W, H); ctx.restore();
    path(body); ctx.stroke();
    // top face
    // top face: the layer's own color, a little lighter so it still reads as a lit surface;
    // only the final hexagon block keeps the white logo top
    path(top); ctx.fillStyle = hexTop ? "#fff" : rgb(color.map(v => v + (255 - v) * 0.22)); ctx.fill(); ctx.stroke();
    if (hexTop) {
      path(HEX.map(p => proj(ox + p[0], oy + p[1], zb + BH, camv, dy)));
      ctx.fillStyle = "#000"; ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function ring(z, camv, grow, color, lw, dash) {
    const g = grow;
    const pts = OUT.map(p => proj(p[0] * (1 + g), p[1] * (1 + g), z, camv));
    path(pts); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
  }

  function draw() {
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    const heat = Math.min(1, tower / TOWER);
    ctx.fillStyle = "#170604"; ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(mix(1), 0.12 + heat * 0.2)); g.addColorStop(1, rgb(mix(0.4), 0.04));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 18 * shake, (Math.random() - .5) * 18 * shake);

    if (retired) {
      const a = Math.max(0, 1 - retired.fall / 1300);
      for (let i = 0; i < retired.count; i++) drawBlock(0, 0, i * BH, tcol(i), i === TOWER - 1, a, retired.camZ, retired.fall);
    }
    for (let i = 0; i < tower; i++) drawBlock(0, 0, i * BH, tcol(i), i === TOWER - 1, 1, camZ, 0);

    if (cur) {
      // ghost slot: line the moving block up with this
      ring(tower * BH + BH, camZ, 0, "rgba(255,233,168,.55)", 2, [6, 6]);
      const ox = cur.axis ? 0 : cur.p, oy = cur.axis ? cur.p : 0;
      drawBlock(ox, oy, tower * BH, tcol(tower), tower === TOWER - 1, 1, camZ, 0);
    }
    for (const p of pieces) drawBlock(p.x, p.y, p.z, tcol(p.i), false, Math.max(0, p.a), camZ, 0);
    if (flash) ring(flash.z + BH, camZ, flash.t * 0.35, `rgba(255,236,160,${1 - flash.t})`, 3 + flash.t * 6);
    ctx.restore();

    // HUD
    ctx.textBaseline = "top"; ctx.textAlign = "center";
    ctx.fillStyle = "#FFE9A8"; ctx.font = "800 64px ui-sans-serif,system-ui,sans-serif"; ctx.fillText(String(score), W / 2, 22);
    ctx.font = "700 14px ui-sans-serif,system-ui,sans-serif"; ctx.fillStyle = "rgba(255,233,168,.75)";
    ctx.textAlign = "left"; ctx.fillText("BEST " + best, 16, 18);
    ctx.textAlign = "right"; ctx.fillText(Math.min(tower, TOWER) + " / " + TOWER, W - 16, 18);
    const pw = W - 32, pg = Math.min(1, tower / TOWER);
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(16, 40, pw, 6);
    const gg = ctx.createLinearGradient(16, 0, 16 + pw, 0); gg.addColorStop(0, rgb(YELLOW)); gg.addColorStop(1, rgb(RED));
    ctx.fillStyle = gg; ctx.fillRect(16, 40, pw * pg, 6);
    if (streak >= 2) { ctx.textAlign = "center"; ctx.font = "800 18px ui-sans-serif,system-ui,sans-serif"; ctx.fillStyle = rgb(mix(Math.min(1, streak / 8))); ctx.fillText("PERFECT x" + streak, W / 2, 96); }
    if (hint > 0) { ctx.textAlign = "center"; ctx.font = "700 16px ui-sans-serif,system-ui,sans-serif"; ctx.fillStyle = `rgba(255,233,168,${Math.min(1, hint)})`; ctx.fillText("TAP / SPACE TO DROP", W / 2, H - 40); }
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  newTower();
  requestAnimationFrame(frame);

  // hook for automated checks
  window.__stack = { drop, setTower: n => { tower = n; }, state: () => ({ score, best, tower, towers, streak, p: cur ? cur.p : null, tol: tol() }) };
})();
</script>
</body>
</html>
