name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Nothing in CI connects to a database; these satisfy config validation and let the
      # health test exercise its 503 path.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-123456
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Migration drift check
        run: bun run scripts/check-migrations.ts
